; PlatformIO Project Configuration File
; Smart Fish Feeder - ESP32 Firmware
;
; Hardware:
; 1. Main Controller: LILYGO T-A7670 R2 (ESP32-WROVER-B + A7670G 4G LTE Cat1)
; 2. Camera Module: ESP32-CAM (AI-Thinker, OV2640)
; 3. Motor: NEMA 23 Stepper + DM542/TB6600 Driver
; 4. Auger: 20mm Wood Drill Auger Bit
; 5. Feed Level: JSN-SR04T Ultrasonic + HX711 Load Cell (20kg, dual sensing)
; 6. Temperature: DS18B20 Waterproof Probe
; 7. Power: Solar Panel + 18650 Li-Ion Battery (built-in charging)
;
; Board Info: https://github.com/Xinyuan-LilyGO/LilyGo-T-A7670
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = t-a7670-dm542
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
lib_deps = 
    ; MQTT Client
    knolleary/PubSubClient@^2.8
    ; JSON parsing
    bblanchon/ArduinoJson@^7.0.0
    ; WiFi Manager for provisioning
    tzapu/WiFiManager@^2.0.17
    ; NTP time sync
    arduino-libraries/NTPClient@^3.2.1

; =============================================================================
; MAIN CONTROLLER: LILYGO T-A7670 R2 with DM542 Driver (Default)
; =============================================================================
[env:t-a7670-dm542]
platform = espressif32@6.4.0
board = esp32dev
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags}
    -DLILYGO_T_A7670
    -DBOARD_HAS_PSRAM
    ; T-A7670 R2 specific pins (A7670G modem)
    -DMODEM_TX=26
    -DMODEM_RX=27
    -DMODEM_PWRKEY=4
    -DMODEM_EN=12
    ; MODEM_DTR(GPIO25) and MODEM_RI(GPIO33) NOT defined - those GPIOs are
    ; used by PIN_DIR and PIN_ULTRASONIC_TRIG per verified schematic.
    ; Modem runs with DTR uncontrolled (always active, no sleep mode).
    ; GPS pins (A7670G variant)
    -DGPS_TX=21
    -DGPS_RX=22
    -DGPS_PPS=19
    ; SD Card (SPI)
    -DSD_MISO=2
    -DSD_MOSI=15
    -DSD_SCLK=14
    -DSD_CS=13
    ; Motor driver: DM542 (Step/Dir/Enable)
    -DUSE_DM542
    ; Verified schematic pin mapping
    -DSCHEMATIC_PINMAP
    ; HX711 not populated
    -DNO_LOADCELL
    ; TinyGSM modem type (A7670 is compatible with SIM7600 profile in TinyGSM 0.11.x)
    -DTINY_GSM_MODEM_SIM7600
lib_deps = 
    ${env.lib_deps}
    ; HX711 Load Cell
    bogde/HX711@^0.7.5
    ; OneWire for DS18B20
    paulstoffregen/OneWire@^2.3.8
    ; Dallas Temperature
    milesburton/DallasTemperature@^3.11.0
    ; TinyGSM for A7670
    vshymanskyy/TinyGSM@^0.11.7
    ; NewPing for JSN-SR04T ultrasonic
    teckel12/NewPing@^1.9.7
    ; TinyGPS++ for GPS parsing
    mikalhart/TinyGPSPlus@^1.0.3

; =============================================================================
; MAIN CONTROLLER: LILYGO T-A7670 R2 with TB6600 Driver
; =============================================================================
[env:t-a7670-tb6600]
platform = espressif32@6.4.0
board = esp32dev
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags}
    -DLILYGO_T_A7670
    -DBOARD_HAS_PSRAM
    -DMODEM_TX=26
    -DMODEM_RX=27
    -DMODEM_PWRKEY=4
    -DMODEM_EN=12
    -DSD_MISO=2
    -DSD_MOSI=15
    -DSD_SCLK=14
    -DSD_CS=13
    ; Motor driver: TB6600 (Step/Dir/Enable)
    -DUSE_TB6600
    -DTINY_GSM_MODEM_SIM7600
lib_deps = 
    ${env.lib_deps}
    bogde/HX711@^0.7.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    vshymanskyy/TinyGSM@^0.11.7
    teckel12/NewPing@^1.9.7
    mikalhart/TinyGPSPlus@^1.0.3

; =============================================================================
; MAIN CONTROLLER: Debug build
; =============================================================================
[env:t-a7670-debug]
extends = env:t-a7670-dm542
build_type = debug
build_flags = 
    ${env:t-a7670-dm542.build_flags}
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=5

; =============================================================================
; MAIN CONTROLLER: Release build
; =============================================================================
[env:t-a7670-release]
extends = env:t-a7670-dm542
build_type = release
build_flags = 
    ${env:t-a7670-dm542.build_flags}
    -DRELEASE_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Os

; =============================================================================
; CAMERA MODULE: ESP32-CAM (AI-Thinker, OV2640)
; =============================================================================
[env:esp32cam]
platform = espressif32@6.4.0
board = esp32cam
board_build.partitions = huge_app.csv
build_src_filter = +<cam/>
build_flags = 
    ${env.build_flags}
    -DESP32_CAM
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_AI_THINKER
lib_deps = 
    ${env.lib_deps}

; =============================================================================
; Wokwi Simulation: Main Controller (24V battery, no solar input)
; =============================================================================
[env:t-a7670-wokwi]
extends = env:t-a7670-dm542
board = esp32dev
monitor_port = rfc2217://localhost:4000
monitor_speed = 115200
extra_scripts = pre:scripts/load_wokwi_env.py
build_flags =
    ${env:t-a7670-dm542.build_flags}
    -DWOKWI_SIM
    -DNO_SOLAR_INPUT
    -DSIM_BATTERY_VOLTAGE=24.0f
    -DSCHEMATIC_PINMAP
    ; Optional HiveMQ Cloud overrides (set via local config or CI secrets)
    ; -DMQTT_USE_TLS=1
    ; -DWOKWI_DEFAULT_MQTT_HOST=\"your-cluster.s1.eu.hivemq.cloud\"
    ; -DWOKWI_DEFAULT_MQTT_USER=\"your_hive_user\"
    ; -DWOKWI_DEFAULT_MQTT_PASS=\"your_hive_password\"
