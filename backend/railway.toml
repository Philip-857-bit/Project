# Railway Configuration for Smart Fish Feeder Backend
# https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"
buildCommand = "if [ -f backend/go.mod ]; then cd backend; fi; go build -o main ./cmd/server"

[deploy]
startCommand = "if [ -f backend/main ]; then cd backend; fi; ./main"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
